# Option A — simple (default Bot API, 48MB per zip, kono extra server lage na)
# Dokploy-e ei file tai use koro jodi 48MB te raji thako.
name: tgbot-simple
services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MAX_ZIP_MB: ${MAX_ZIP_MB:-48}
      ALLOWED_IDS: ${ALLOWED_IDS:-}
    tmpfs:
      - /tmp:size=2G
