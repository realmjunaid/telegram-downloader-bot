# 2GB zip (local Bot API server soho, max limit)
# .env-e bosao:
#   TELEGRAM_API_ID=...
#   TELEGRAM_API_HASH=...
#   BOT_TOKEN=...
name: tgbot-localapi
services:
  botapi:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_STAT: "1"
    command: >-
      --local
      --http-port 8081
      --dir /var/lib/telegram-bot-api
      --temp-dir /tmp/telegram-bot-api
      --log-level 2
    volumes:
      - botapi-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - botapi
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_IDS: ${ALLOWED_IDS:-}
      TELEGRAM_API_BASE_URL: http://botapi:8081/bot
      TELEGRAM_API_BASE_FILE_URL: http://botapi:8081/file/bot
    # 2GB zip + source ak sathe /tmp-e thake, tai disk-backed volume.
    # RAM-backed tmpfs-e 2GB+2GB dhorbe na (OOM hobe).
    volumes:
      - tmpdata:/tmp

  # botapi-er cache (sent file copy) auto-clean — nahole VPS disk full hobe.
  # 6h+ purono file hourly delete kore. Cholti upload-e hat dey na.
  cleaner:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - botapi-data:/clean:rw
    command: >
      sh -c "while true; do find /clean -type f -mmin +360 -delete 2>/dev/null; sleep 3600; done"

volumes:
  botapi-data:
  tmpdata:
